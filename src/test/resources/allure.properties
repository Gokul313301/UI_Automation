# Allure Report Configuration

# Results directory
allure.results.directory=allure-results

# Report title
allure.report.title=Automation Test Results

# Link to issue tracker (optional)
allure.link.issue.pattern=https://github.com/yourorg/yourrepo/issues/{}
allure.link.testcase.pattern=https://github.com/yourorg/yourrepo/blob/main/{}

# Screenshots and attachments
allure.link.source.pattern=https://github.com/yourorg/yourrepo/blob/main/{}
